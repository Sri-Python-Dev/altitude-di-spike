# Optional: Postgres in Docker instead of a local install (docker compose up -d).
# Temporal runs from its CLI: `temporal server start-dev` (see docs/vdi-setup.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: altitude
      POSTGRES_PASSWORD: altitude-local-only
      POSTGRES_DB: altitude_di
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/vdi/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
